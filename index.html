<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Vibe Lite</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0f0f;color:white;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;background:#1a1a1a;font-weight:bold;font-size:18px;text-align:center;border-bottom:1px solid #333}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{background:#222;padding:10px 14px;border-radius:18px;max-width:80%;word-break:break-word}
.msg.me{align-self:flex-end;background:#0084ff}
.msg a{color:#4fc3f7}
.tiktok-preview{background:#111;border:1px solid #333;padding:8px;border-radius:12px;margin-top:6px}
.footer{display:flex;padding:10px;background:#1a1a1a;gap:8px}
input{flex:1;padding:12px;border-radius:25px;border:none;outline:none;background:#2a2a2a;color:white}
button{padding:12px 18px;border-radius:25px;border:none;background:#0084ff;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="header">Timber Vibe Lite</div>
<div id="chat"></div>
<div class="footer">
<input id="msgInput" placeholder="Paste TikTok link or chat..." />
<button onclick="sendMsg()">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msgInput');
let messages = JSON.parse(localStorage.getItem('timber_msgs')||'[]');

function render(){
 chat.innerHTML='';
 messages.forEach(m=>{
   const div = document.createElement('div');
   div.className = 'msg ' + (m.me?'me':'');
   let html = linkify(m.text);
   if(isTikTokLink(m.text)){
     html += `<div class="tiktok-preview">🎵 TikTok Video<br><a href="${m.text}" target="_blank">Open in TikTok: ${m.text.substring(0,30)}...</a><br><br><small>Share will open inside Timber Vibe</small></div>`;
   }
   div.innerHTML = html;
   chat.appendChild(div);
 });
 chat.scrollTop = chat.scrollHeight;
}

function isTikTokLink(t){ return t.includes('tiktok.com'); }
function linkify(t){ return t.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>'); }

function sendMsg(){
 const text = input.value.trim();
 if(!text) return;
 messages.push({text, me:true, time:Date.now()});
 localStorage.setItem('timber_msgs', JSON.stringify(messages));
 input.value='';
 render();
 // fake reply for demo
 if(isTikTokLink(text)){
   setTimeout(()=>{
     messages.push({text: "Nice! Shared to Timber Vibe 🔥", me:false});
     localStorage.setItem('timber_msgs', JSON.stringify(messages));
     render();
   },800);
 }
}

input.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg() });
render();
</script>
</body>
</html>
